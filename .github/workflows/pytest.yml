name: "Pytest tests"

on:
  push:
    branches: ['devel']
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout metrics-utility"
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: "Install uv"
        uses: astral-sh/setup-uv@v7

      - name: "Set up Python"
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: "Set up postgresql"
        run: |
          sudo apt install postgresql postgresql-client
          sudo systemctl start postgresql.service  # ubuntu

      - name: "Wait for postgresql"
        timeout-minutes: 1
        run: |
          until pg_isready; do
            sleep 4
          done

      - name: "Import SQL dump"
        run: |
          cat tools/docker/{roles,latest,functions,conf_setting,main_hostmetric,main_instance,main_jobhostsummary,dab_feature_flags}.sql \
            | sudo su - postgres -c psql \
              2> >(while IFS= read -r line; do
                if [[ "$line" == ERROR:* ]]; then
                  echo "::error title=PostgreSQL import::$line"
                else
                  echo "$line" >&2
                fi
              done)

      - name: "Pull SeaweedFS"
        run: |
          mkdir -p ~/.local/bin
          curl -fL https://github.com/seaweedfs/seaweedfs/releases/latest/download/linux_amd64.tar.gz -o /tmp/seaweedfs.tar.gz
          curl -fL https://github.com/seaweedfs/seaweedfs/releases/latest/download/linux_amd64.tar.gz.md5 -o /tmp/seaweedfs.md5

          EXPECTED=$(awk '{print $1}' /tmp/seaweedfs.md5)
          ACTUAL=$(md5sum /tmp/seaweedfs.tar.gz | awk '{print $1}')
          [ "$EXPECTED" = "$ACTUAL" ]

          tar -xzf /tmp/seaweedfs.tar.gz -C ~/.local/bin
          chmod +x ~/.local/bin/weed

      - name: "Start SeaweedFS"
        run: |
          AWS_ACCESS_KEY_ID=myuseraccesskey \
          AWS_SECRET_ACCESS_KEY=myusersecretkey \
          S3_BUCKET=metricsutilitys3 \
          weed mini -dir=/tmp/seaweedfs-data &

      - name: "Wait for SeaweedFS"
        timeout-minutes: 1
        run: |
          until curl -s -o /dev/null http://localhost:8333; do
            sleep 2
          done

      - name: "Set up Go"
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: tools/mock-segment-server/go.mod

      - name: "Start mock Segment server"
        timeout-minutes: 1
        run: |
          go build -C tools/mock-segment-server -o /tmp/mock-segment-server .
          /tmp/mock-segment-server &
          until curl -sf http://localhost:8765/requests > /dev/null; do sleep 1; done

      - name: "Patch mock_awx postgres config"
        run: |
          sed -i '/NAME/s/awx/postgres/' mock_awx/settings/__init__.py
          sed -i '/USER/s/myuser/awx/' mock_awx/settings/__init__.py
          sed -i '/PASSWORD/s/mypassword/awx/' mock_awx/settings/__init__.py

      - name: "Run pytest"
        env:
          METRICS_UTILITY_BUCKET_ACCESS_KEY: "myuseraccesskey"
          METRICS_UTILITY_BUCKET_ENDPOINT: "http://localhost:8333"
          METRICS_UTILITY_BUCKET_NAME: "metricsutilitys3"
          METRICS_UTILITY_BUCKET_REGION: "us-east-1"
          METRICS_UTILITY_BUCKET_SECRET_KEY: "myusersecretkey"
          METRICS_UTILITY_DB_HOST: "localhost"
          METRICS_UTILITY_DB_NAME: "postgres"
          METRICS_UTILITY_DB_USER: "awx"
          METRICS_UTILITY_DB_PASSWORD: "awx"
          MOCK_SEGMENT_URL: "http://localhost:8765"
        run: |
          uv run pytest -s -v --cov=. --cov-report=xml

      - name: "Upload code coverage report"
        if: ${{ github.base_ref }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.xml

      - name: "Save off PR number"
        if: github.event_name == 'pull_request'
        run: echo "PR ${{ github.event.pull_request.number }}" > pr_number.txt

      - name: "Upload PR number"
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: pr_number
          path: pr_number.txt

      - name: "Send code coverage report to Sonar Cloud (on push)"
        uses: SonarSource/sonarqube-scan-action@v7
        if: ${{ ! github.base_ref }}
        env:
          SONAR_HOST_URL: https://sonarcloud.io
          SONAR_ORGANIZATION: ansible
          SONAR_PROJECT_KEY: ansible_metrics-utility
          SONAR_TOKEN: ${{ secrets.CICD_ORG_SONAR_TOKEN_CICD_BOT }}
        with:
          projectBaseDir: .
          args: >
            -Dsonar.host.url=https://sonarcloud.io
            -Dsonar.organization=ansible
            -Dsonar.projectKey=ansible_metrics-utility
            -Dsonar.python.coverage.reportPaths=coverage.xml
