services:
  seaweedfs:
    image: "mirror.gcr.io/chrislusf/seaweedfs:latest"
    container_name: seaweedfs
    ports:
      - "8333:8333"
    environment:
      AWS_ACCESS_KEY_ID: "myuseraccesskey"
      AWS_SECRET_ACCESS_KEY: "myusersecretkey"
      S3_BUCKET: "metricsutilitys3"
    tmpfs:
      - /data:mode=1777
    healthcheck:
      test: ["CMD", "curl", "-s", "-o", "/dev/null", "http://localhost:8333"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: "mirror.gcr.io/postgres"
    container_name: postgres
    environment:
      POSTGRES_DB: "awx"
      POSTGRES_USER: "myuser"
      POSTGRES_PASSWORD: "mypassword"
    ports:
      - "5432:5432"
    volumes:
      - ./roles.sql:/docker-entrypoint-initdb.d/init-0-roles.sql
      - ./latest.sql:/docker-entrypoint-initdb.d/init-1-schema.sql
      - ./functions.sql:/docker-entrypoint-initdb.d/init-2-functions.sql
      - ./conf_setting.sql:/docker-entrypoint-initdb.d/init-3-conf_setting.sql
      - ./main_hostmetric.sql:/docker-entrypoint-initdb.d/init-4-main_hostmetric.sql
      - ./main_instance.sql:/docker-entrypoint-initdb.d/init-5-main_instance.sql
      - ./main_jobhostsummary.sql:/docker-entrypoint-initdb.d/init-6-main_jobhostsummary.sql
      - ./dab_feature_flags.sql:/docker-entrypoint-initdb.d/init-7-dab_feature_flags.sql
      - ./main_indirectmanagednodeaudit.sql:/docker-entrypoint-initdb.d/init-8-main_indirectmanagednodeaudit.sql

  postgres-wait:
    image: "mirror.gcr.io/postgres"
    depends_on:
      - postgres
    command: |
      sh -c '
        echo "Waiting for PostgreSQL to be ready..."
        until pg_isready -h postgres; do
          sleep 2
        done
      '

  metrics-utility:
    image: "mirror.gcr.io/python"
    container_name: metrics-utility
    depends_on:
      seaweedfs:
        condition: service_healthy
      postgres-wait:
        condition: service_completed_successfully
    volumes:
      - ../..:/app_ro
    tmpfs:
      - /app:rw,exec,mode=0755,uid=1001
    working_dir: /app
    profiles: ["pytest"] # makes this service non-default, except when --profile=pytest
    environment:
      METRICS_UTILITY_BUCKET_ACCESS_KEY: "myuseraccesskey"
      METRICS_UTILITY_BUCKET_ENDPOINT: "http://seaweedfs:8333"
      METRICS_UTILITY_BUCKET_NAME: "metricsutilitys3"
      METRICS_UTILITY_BUCKET_REGION: "us-east-1"
      METRICS_UTILITY_BUCKET_SECRET_KEY: "myusersecretkey"
      METRICS_UTILITY_DB_HOST: "postgres"
    entrypoint: |
      sh -c '
        set -e
        rsync -a --exclude=.git --exclude=.venv --exclude=.ruff_cache --exclude=/build --exclude=/dist /app_ro/ /app/metrics-utility/

        cd /app/metrics-utility/
        sed -i '/HOST/s/localhost/postgres/' mock_awx/settings/__init__.py

        pip install uv
        uv sync

        uv run pytest -s -v
      '

  metrics-utility-env:
    build:
      context: .
      args:
        SRC_MOUNT: /app
    image: "mirror.gcr.io/python"
    container_name: metrics-utility-env
    depends_on:
      seaweedfs:
        condition: service_healthy
      postgres-wait:
        condition: service_completed_successfully
    volumes:
      - ../../:/app         # Mount the current local directory to /app in the container
    working_dir: /app
    profiles: ["env"] # makes this service non-default, except when --profile=env
    environment:
      METRICS_UTILITY_BUCKET_ACCESS_KEY: "myuseraccesskey"
      METRICS_UTILITY_BUCKET_ENDPOINT: "http://seaweedfs:8333"
      METRICS_UTILITY_BUCKET_NAME: "metricsutilitys3"
      METRICS_UTILITY_BUCKET_REGION: "us-east-1"
      METRICS_UTILITY_BUCKET_SECRET_KEY: "myusersecretkey"
      METRICS_UTILITY_DB_HOST: "postgres"
    entrypoint: |
      sh -c '
        set -e

        ls

        pip install uv
        uv sync

        env | grep ^METRICS | sort

        tail -f /dev/null
      '
